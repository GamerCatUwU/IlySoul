:root{--pink:#f04acb;--pink2:#ff79df;--bg:#080408;--line:#b943a1;--muted:#c28bb8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#f7d9f1;font-family:'Courier New',monospace;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:10;opacity:.04;background-image:url('assets/crt-grain.png')}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.topbar{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;padding:0 22px;position:relative;z-index:5;background:#080408e8}
.brand{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:24px;color:var(--pink);letter-spacing:-1.5px;min-width:170px}
.brand:after{content:"✶";font-family:serif;font-size:22px;margin-left:8px}
.nav{display:flex;align-items:center;gap:42px;height:100%;font-size:15px}
.nav a{height:100%;display:flex;align-items:center;position:relative;color:#e8b9df}
.nav a.active,.nav a:hover{color:var(--pink)}
.nav a.active:after{content:"";position:absolute;bottom:9px;left:0;right:0;height:2px;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.top-player{margin-left:auto;border:1px solid var(--line);height:42px;min-width:290px;display:flex;align-items:center;gap:13px;padding:0 12px;background:#0b070d}
.top-player button{border:0;background:none;color:var(--pink);font-size:18px;cursor:pointer}
.top-player span{font-size:13px;white-space:nowrap}
.equalizer{margin-left:auto;display:flex;align-items:end;gap:3px;height:22px}
.equalizer i{--rest:.35;width:3px;height:100%;background:var(--pink);transform-origin:bottom;transform:scaleY(var(--rest));animation:bars .7s infinite alternate}
.equalizer i:nth-child(2){--rest:.8;animation-delay:.2s}.equalizer i:nth-child(3){--rest:.55;animation-delay:.4s}.equalizer i:nth-child(4){--rest:1;animation-delay:.1s}.equalizer i:nth-child(5){--rest:.65;animation-delay:.3s}
.paused .equalizer i{animation:none;transform:scaleY(.13636)}
@keyframes bars{to{transform:scaleY(1)}}
.layout{display:grid;grid-template-columns:90px 1fr;min-height:calc(100vh - 58px)}
.social-rail{border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;gap:23px;padding-top:36px;position:relative;z-index:2}
.social-rail a{width:34px;height:34px;display:grid;place-items:center;color:var(--pink);transition:.2s}
.social-rail a:hover{transform:scale(1.15);filter:drop-shadow(0 0 8px var(--pink))}
.social-rail svg{width:29px;height:29px;fill:currentColor}
main{position:relative;min-width:0;overflow:hidden;background:#080408}
.hero-art{position:absolute;inset:0;pointer-events:none}
.hero-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 56%,#080408 98%),linear-gradient(90deg,#080408,transparent 18%,transparent 84%,#080408),repeating-linear-gradient(180deg,transparent 0 2px,rgba(8,4,8,.28) 2px 3px)}
@media(width > 620px){
 .hero-art{overflow:hidden;background:#080408 url('assets/desktop-arch.webp') center 35% / cover no-repeat}
 .hero-art:before{content:"";position:absolute;inset:0 0 auto;height:16%;background:linear-gradient(180deg,transparent,rgba(255,121,223,.065),transparent);animation:crtSweep 12s linear infinite}
}
@keyframes crtSweep{from{transform:translateY(-425%)}to{transform:translateY(950%)}}
@media(prefers-reduced-motion:reduce){.hero-art:before{animation:none;opacity:0}}
.hero-logo{position:absolute;top:8%;left:8%;z-index:1;font-family:cursive;font-weight:900;font-style:italic;font-size:clamp(70px,10vw,150px);line-height:.85;letter-spacing:-.1em;color:#f34bd0;text-shadow:0 0 3px #ff8be5,0 0 22px #d323b5,5px 7px 0 #681052;transform:rotate(-5deg);will-change:scale;user-select:none}
@media(prefers-reduced-motion:reduce){.hero-logo{scale:1!important}}
.hero-logo:after{content:"✶";font-family:serif;font-size:.42em;vertical-align:top;margin-left:.16em}
.spark{position:absolute;color:var(--pink);font-size:42px;text-shadow:0 0 15px var(--pink);z-index:1}
.spark.one{top:6%;left:40%}.spark.two{top:31%;right:5%;font-size:34px}.spark.three{bottom:25%;left:39%;font-size:56px}
.window{position:absolute;border:1px solid var(--pink);background:rgba(7,4,9,.92);box-shadow:0 0 18px #d02a9c26;z-index:3}
.window.minimized> :not(.window-head){display:none}.window-head{height:29px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 9px;color:var(--pink);font-size:15px;gap:7px}
.window-head strong{font-weight:400}
.controls{margin-left:auto;display:flex;gap:5px}
.controls button{width:17px;height:17px;border:1px solid var(--pink);background:transparent;color:var(--pink);line-height:12px;padding:0;cursor:pointer}
.player-window{left:3.5%;top:42%;width:min(485px,43%);padding-bottom:12px}
.track-content{display:flex;gap:14px;padding:12px}
.cover{width:105px;height:100px;object-fit:cover;border:1px solid #63305a}
.track-meta{flex:1;min-width:0;padding-top:4px}
.track-name{font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700;color:var(--pink2)}
.artist{font-size:13px;color:#d3a5ca;margin-top:4px}
.track-progress{display:flex;align-items:center;gap:10px;margin:16px 0 13px;font-size:12px;color:#d8b4d1}
.progress{height:6px;background:#40203a;flex:1;cursor:pointer}
.progress-fill{height:100%;transform:scaleX(0);transform-origin:left;background:var(--pink);box-shadow:0 0 8px var(--pink)}
.controls-row{display:flex;justify-content:space-around;align-items:center;color:var(--pink);font-size:20px}
.controls-row button{border:0;background:none;cursor:pointer;color:var(--pink);font-size:19px}
.controls-row .main-play{background:var(--pink);color:#170714;width:39px;height:39px;border-radius:50%;font-size:17px}
.heart{position:absolute;right:17px;top:47px;border:0;background:none;color:var(--pink);font-size:22px;cursor:pointer}
.about-window{right:4.5%;top:10%;width:min(335px,30%)}
.about-body{display:flex;gap:13px;padding:15px}
.about-body img{width:108px;height:120px;object-fit:cover;filter:grayscale(.3)}
.about-copy{font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.55;color:#e6b9dd}
.about-copy p{margin:0 0 10px}
.about-copy .more{color:var(--pink)}
.releases{position:absolute;left:2.5%;bottom:5%;width:min(550px,48%);z-index:3;background:#070409d9;padding:13px 14px 15px}
.section-head{display:flex;align-items:center;color:var(--pink);font-size:17px;margin-bottom:13px}
.section-head .view{margin-left:auto;font-size:12px;color:#d6a2cc}
.release-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.release{min-width:0;display:block;cursor:pointer;transition:transform .2s}.release:hover{transform:translateY(-4px)}.release-loading{grid-column:1/-1;color:#d6a2cc;font-size:13px;padding:18px 0}
.release img{width:100%;aspect-ratio:1.15;object-fit:cover;border:1px solid #743765;display:block;filter:saturate(.85)}
.release .name{font-family:Arial,Helvetica,sans-serif;color:var(--pink2);font-weight:600;font-size:13px;margin-top:7px}
.release .by{font-size:12px;color:#d1a4c8;margin-top:2px}
.eye-window{right:17%;bottom:8%;width:min(470px,42%);z-index:2}
.eye-window img{display:block;width:100%;height:180px;object-fit:cover;object-position:center 48%;filter:contrast(1.1) saturate(.8)}
.mini-note{position:absolute;right:11%;bottom:6%;width:220px;height:75px;background:#09050b;border:1px solid var(--pink);z-index:4;padding:10px 13px;color:var(--pink);box-shadow:0 0 15px #d02a9c24}
.mini-note .note-top{display:flex;justify-content:space-between;font-size:14px}
.mini-note .cursor{display:block;font-size:24px;line-height:24px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
footer{height:49px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:var(--pink);font-size:12px;position:relative;z-index:3;background:#080408}

  height:auto;aspect-ratio:16 / 9;border:0
 }

 .visual-bg:before{opacity:.9}

   repeating-linear-gradient(0deg,transparent 0 2px,rgba(255,120,220,.09) 3px)
 }
 .hero-art{display:none}
}
@keyframes starDrift{to{transform:translate(160px,160px)}}

  visualImage.src='https://i.ytimg.com/vi/'+(track.videoId||track.artId)+'/maxresdefault.jpg';
  if(!track.videoId) return;
  if(!window.YT?.Player){
    if(!document.getElementById('youtube-api')){
      const script=document.createElement('script');
      script.id='youtube-api';
      script.src='https://www.youtube.com/iframe_api';
      document.head.append(script);
    }
    return;
  }

  const params=new URLSearchParams({
    autoplay:visualWantsPlayback?'1':'0',
    mute:'1',
    controls:'0',
    loop:'1',
    playlist:track.videoId,
    playsinline:'1',
    rel:'0',
    enablejsapi:'1',
    origin:location.origin
  });
  const frame=document.createElement('iframe');
  frame.title='Music video background';
  frame.allow='autoplay; encrypted-media';
  frame.referrerPolicy='strict-origin-when-cross-origin';
  frame.tabIndex=-1;
  frame.src=youtubeHost+'/embed/'+track.videoId+'?'+params;
  visualMedia.append(frame);

  visualPlayer=new YT.Player(frame,{
    events:{
      onReady(event){
        if(event.target!==visualPlayer) return;
        visualReady=true;
        event.target.mute();
        if(visualWantsPlayback) event.target.playVideo();
        else event.target.pauseVideo();
      },
      onStateChange(event){
        if(event.target===visualPlayer && event.data===YT.PlayerState.PLAYING){
          visualMedia.classList.add('has-video');
          if(!visualWantsPlayback) event.target.pauseVideo();
        }
      },
      onError(event){
        if(event.target===visualPlayer) visualMedia.classList.remove('has-video');
      }
    }
  });
}

window.onYouTubeIframeAPIReady=setVisual;
mobileVisual.addEventListener('change',setVisual);

function setVisualPlayback(playing){
  visualWantsPlayback=playing;
  if(!visualReady) return;
  if(playing) visualPlayer.playVideo();
  else visualPlayer.pauseVideo();
}

const heroLogo=document.querySelector('.hero-logo');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let audioContext,analyser,beatFrame;
let logoVisible=false;

function prepareBeatAudio(){
  const AudioContext=window.AudioContext||window.webkitAudioContext;
  if(reducedMotion.matches||!AudioContext) return;
  audioContext??=new AudioContext();

  // Connect after the context runs so a blocked resume cannot mute the player.
  const connect=()=>{
    if(!analyser){
      analyser=audioContext.createAnalyser();
      analyser.fftSize=2048;
      analyser.smoothingTimeConstant=.28;
      analyser.minDecibels=-85;
      analyser.maxDecibels=-12;
      const source=audioContext.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioContext.destination);
    }
    if(!audio.paused && !audio.ended && audio.readyState>=3) startBeatVisual();
  };
  if(audioContext.state==='running') connect();
  else audioContext.resume().then(connect).catch(()=>{});
}

function playTrack(){
  prepareBeatAudio();
  audio.play().catch(updateState);
}

function stopBeatVisual(){
  cancelAnimationFrame(beatFrame);
  beatFrame=undefined;
  heroLogo.style.removeProperty('scale');
}

function startBeatVisual(){
  if(!analyser || !logoVisible || reducedMotion.matches || beatFrame!==undefined) return;
  const data=new Uint8Array(analyser.frequencyBinCount);
  const binWidth=audioContext.sampleRate/analyser.fftSize;
  const firstBin=Math.ceil(35/binWidth);
  const lastBin=Math.floor(145/binWidth);
  let previousTime,average,pulse=0,previousScale=1;

  function animateBeat(time){
    const elapsed=previousTime===undefined?0:Math.min((time-previousTime)/1000,.1);
    previousTime=time;
    analyser.getByteFrequencyData(data);
    let bass=0;
    for(let bin=firstBin;bin<=lastBin;bin++) bass+=data[bin];
    bass/=255*(lastBin-firstBin+1);

    // Pulse on bass transients, with a short decay between beats.
    average??=bass;
    const attack=Math.max(0,(bass-average-.04)*7);
    pulse=Math.min(1,Math.max(attack,pulse*Math.exp(-elapsed/.12)));
    average+=(bass-average)*(1-Math.exp(-elapsed/.2));
    const scale=Math.round((1+.12*pulse)*1000)/1000;
    if(scale!==previousScale){
      heroLogo.style.scale=scale;
      previousScale=scale;
    }
    beatFrame=requestAnimationFrame(animateBeat);
  }
  beatFrame=requestAnimationFrame(animateBeat);
}

new IntersectionObserver(([entry])=>{
  logoVisible=entry.isIntersecting;
  if(!logoVisible) stopBeatVisual();
  else if(!audio.paused && !audio.ended && audio.readyState>=3) startBeatVisual();
}).observe(heroLogo);

reducedMotion.addEventListener('change',()=>{
  if(reducedMotion.matches) stopBeatVisual();
  else if(!audio.paused && !audio.ended && audio.readyState>=3) prepareBeatAudio();
});

function formatTime(value){
  if(!Number.isFinite(value)) return '0:00';
  return Math.floor(value/60)+':'+String(Math.floor(value%60)).padStart(2,'0');
}

function updateState(){
  const playing=!audio.paused;
  topPlayer.classList.toggle('paused',!playing);
  toggles.forEach(button=>{
    button.textContent=playing?'Ⅱ':'▶';
    button.setAttribute('aria-label',playing?'Pause':'Play');
  });
}

function loadTrack(index,autoplay=false){
  currentTrack=(index+tracks.length)%tracks.length;
  audio.src=tracks[currentTrack].src;
  setVisual();
  trackName.textContent=tracks[currentTrack].name;
  progressFill.style.transform='scaleX(0)';
  timeDisplay.textContent='0:00 / 0:00';
  player.querySelector('.window-head strong').textContent=tracks[currentTrack].name+' — ilySoul';
  if(autoplay) playTrack();
  else updateState();
}

function nextTrack(){
  let next=currentTrack+1;
  if(shuffle&&tracks.length>1){
    do{next=Math.floor(Math.random()*tracks.length)}while(next===currentTrack);
  }
  loadTrack(next,true);
}

toggles.forEach(button=>button.addEventListener('click',()=>{
  if(audio.paused) playTrack();
  else audio.pause();
}));

buttons[0].addEventListener('click',()=>{
  shuffle=!shuffle;
  buttons[0].style.opacity=shuffle?'1':'.55';
});

buttons[1].addEventListener('click',()=>{
  if(audio.currentTime>3) audio.currentTime=0;
  else loadTrack(currentTrack-1,true);
});

buttons[3].addEventListener('click',nextTrack);

buttons[4].addEventListener('click',()=>{
  audio.addEventListener('pause',()=>{updateState();});
  audio.loop=repeat;
  buttons[4].style.opacity=repeat?'1':'.55';
});

audio.addEventListener('play',()=>{updateState();setVisualPlayback(true);});
audio.addEventListener('playing',startBeatVisual);
audio.addEventListener('waiting',stopBeatVisual);
audio.addEventListener('pause',()=>{
  updateState();
  setVisualPlayback(false);
  stopBeatVisual();
});
audio.addEventListener('ended',()=>{
  stopBeatVisual();
  if(!repeat) nextTrack();
});

audio.addEventListener('loadedmetadata',()=>{
  timeDisplay.textContent='0:00 / '+formatTime(audio.duration);
});

audio.addEventListener('timeupdate',()=>{
  if(!Number.isFinite(audio.duration) || audio.duration<=0) return;
  progressFill.style.transform=`scaleX(${audio.currentTime/audio.duration})`;
  const label=formatTime(audio.currentTime)+' / '+formatTime(audio.duration);
  if(timeDisplay.textContent!==label) timeDisplay.textContent=label;
});

progress.addEventListener('click',event=>{
  if(!Number.isFinite(audio.duration)) return;
  const rect=progress.getBoundingClientRect();
  audio.currentTime=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width))*audio.duration;
});

loadTrack(0);

document.getElementById('heart').addEventListener('click',event=>{
  const liked=event.currentTarget.textContent==='♥';
  event.currentTarget.textContent=liked?'♡':'♥';
  event.currentTarget.style.color=liked?'':'#ff79df';
});

document.querySelectorAll('.controls button').forEach(button=>{
  button.addEventListener('click',()=>{
    const window=button.closest('.window');
    if(button.getAttribute('aria-label')==='Close') window.style.display='none';
    if(button.getAttribute('aria-label')==='Minimize') window.classList.toggle('minimized');
  });
});

document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',()=>{
  document.querySelectorAll('.nav a').forEach(item=>item.classList.remove('active'));
  link.classList.add('active');
}));
async function loadLatestReleases(){
  const grid=document.getElementById('releaseGrid');
  try{
    const response=await fetch('/api/spotify/releases');
    if(!response.ok) throw new Error('Release feed unavailable');
    const data=await response.json();
    if(!Array.isArray(data.releases)||!data.releases.length) throw new Error('No releases found');
    grid.innerHTML=data.releases.slice(0,3).map(item=>`
      <a class="release" href="${item.url}" target="_blank" rel="noopener noreferrer">
        <img src="${item.image||''}" alt="${escapeHtml(item.name)} artwork" loading="lazy">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="by">${escapeHtml(item.dateLabel)}</div>
      </a>
    `).join('');
  }catch(error){
    grid.innerHTML='<div class="release-loading">Latest releases could not be loaded right now.</div>';
  }
}
function escapeHtml(value){
  return String(value).replace(/[&<>\"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[char]));
}
loadLatestReleases();
</script>
